<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | Uday Chutney and Masale</title>
  <meta name="description" content="Get in touch with Uday Chutney and Masale, Kolhapur — call, WhatsApp, or find us on the map." />
  <meta property="og:title" content="Contact Us | Uday Chutney and Masale" />
  <meta property="og:description" content="Get in touch with Uday Chutney and Masale, Kolhapur — call, WhatsApp, or find us on the map." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://udaychutneymasale.netlify.app/contact.html" />
  <meta property="og:image" content="https://udaychutneymasale.netlify.app/images/logo/uday-logo.jpg" />
  <link rel="icon" type="image/jpeg" href="images/logo/uday-logo.jpg" />
  
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>

  <div id="site-header"></div>

  <section class="section">
    <div class="container">
      <h1 class="section-title">Contact Us</h1>
      <p class="section-subtitle">We'd love to hear from you.</p>

      <div class="contact-layout">
        <div class="contact-info-col">
          <div class="contact-info-item">
            <h3>Business</h3>
            <p id="contact-business-name"></p>
            <p id="contact-business-tagline"></p>
          </div>

          <div class="contact-info-item">
            <h3>Reach Us</h3>
            <a id="contact-phone-link" class="contact-action-link" href="#">
              📞 Call Now
            </a>
            <a id="contact-whatsapp-link" class="contact-action-link" href="#" target="_blank" rel="noopener">
              💬 WhatsApp
            </a>
            <a id="contact-email-link" class="contact-action-link" href="#">
              ✉️ Email Us
            </a>
          </div>

          <div class="contact-info-item">
            <h3>Location</h3>
            <p id="contact-city-state"></p>
            <a id="contact-maps-link" class="contact-action-link" href="#" target="_blank" rel="noopener">
              📍 Get Directions
            </a>
          </div>

          <div class="contact-info-item">
            <h3>Business Hours</h3>
            <p id="contact-hours-detail"></p>
          </div>

          <div class="contact-info-item" id="contact-social-item">
            <h3>Follow Us</h3>
            <div class="contact-social-links" id="contact-social-links">
              <!-- Rendered by js/contact.js -->
            </div>
          </div>
        </div>

        <div class="contact-map-col">
          <div class="contact-map-embed" id="contact-map-embed">
            <!-- Rendered by js/contact.js -->
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/products.js"></script>
  <script src="js/components.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
